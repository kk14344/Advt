name: Build & Publish Release

on:
  push:
    tags:
      - 'official-v*'
      - 'testpvp-v*'
  workflow_dispatch:
    inputs:
      channel:
        description: 'Release channel (official / testpvp / all)'
        required: true
        default: 'all'
        type: choice
        options:
          - all
          - official
          - testpvp
      version:
        description: 'Semantic version (e.g. 1.0.0)'
        required: true
        default: '1.0.0'
      notes:
        description: 'Release notes shown in updater'
        required: false
        default: 'v1.0.0 初始发布：双端独立更新通道（静默日志检测、设置页按需一键更新、镜像自动回退、SHA-256 强制校验与原地替换重启）。'

permissions:
  contents: write

env:
  PYTHONUTF8: '1'
  PYTHONIOENCODING: 'utf-8'

concurrency:
  group: release-publish
  cancel-in-progress: false

jobs:
  build-and-release:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Determine channel and version
        id: meta
        shell: pwsh
        run: |
          if ("${{ github.event_name }}" -eq "push") {
            $tag = "${{ github.ref_name }}"
            if ($tag -match '^(official|testpvp)-v([0-9]+\.[0-9]+\.[0-9]+)$') {
              $channel = $Matches[1]
              $version = $Matches[2]
              $notes = (git tag -l --format='%(contents)' $tag | Out-String).Trim()
              if (-not $notes) { $notes = "发布 $channel v$version" }
            } else {
              throw "Invalid tag format: $tag (expected official-vX.Y.Z or testpvp-vX.Y.Z)"
            }
          } else {
            $channel = "${{ inputs.channel }}"
            $version = "${{ inputs.version }}"
            $notes = "${{ inputs.notes }}"
          }
          "channel=$channel" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          Set-Content -LiteralPath "$env:RUNNER_TEMP\release_notes.txt" -Value $notes -Encoding utf8

      - name: Sync version into source files
        shell: python
        run: |
          from pathlib import Path
          import re
          ver = "${{ steps.meta.outputs.version }}"
          root = Path('.')
          p = root / 'src/AandmAuto/BuildEdition.cs'
          p.write_text(re.sub(r'internal const string AppVersion = "[^"]+";', f'internal const string AppVersion = "{ver}";', p.read_text('utf-8')), 'utf-8')
          p = root / 'src/Properties/AssemblyInfo.cs'
          txt = p.read_text('utf-8')
          txt = re.sub(r'AssemblyFileVersion\("[^"]+"\)', f'AssemblyFileVersion("{ver}.0")', txt)
          txt = re.sub(r'AssemblyVersion\("[^"]+"\)', f'AssemblyVersion("{ver}.0")', txt)
          p.write_text(txt, 'utf-8')
          for rel in ['src/automation.lua', 'src/bridge.js', 'tools/build.py', 'tools/test_background_133.cjs']:
              fp = root / rel
              t = fp.read_text('utf-8')
              t = re.sub(r'\b1\.\d+\.\d+\b', ver, t)
              fp.write_text(t, 'utf-8')

      - name: Build executables & generate updates.json
        shell: pwsh
        run: |
          $notes = (Get-Content -LiteralPath "$env:RUNNER_TEMP\release_notes.txt" -Raw -Encoding utf8).Trim()
          python tools/release_manifest.py --channel "${{ steps.meta.outputs.channel }}" --version "${{ steps.meta.outputs.version }}" --notes $notes --asset-ascii
          if (Test-Path -LiteralPath "dist/冒险与挖矿自动助手-优化版.exe") {
            Copy-Item -LiteralPath "dist/冒险与挖矿自动助手-优化版.exe" -Destination "dist/AandmAuto-Official.exe" -Force
          }
          if (Test-Path -LiteralPath "dist/冒险与挖矿自动助手-测试服PvP版.exe") {
            Copy-Item -LiteralPath "dist/冒险与挖矿自动助手-测试服PvP版.exe" -Destination "dist/AandmAuto-TestPvP.exe" -Force
          }

      - name: Run updater self-test
        shell: pwsh
        run: |
          python tools/test_updater.py --channel "${{ steps.meta.outputs.channel }}"

      - name: Publish GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $ch = "${{ steps.meta.outputs.channel }}"
          $ver = "${{ steps.meta.outputs.version }}"
          $notesFile = "$env:RUNNER_TEMP\release_notes.txt"
          $channels = if ($ch -eq 'all') { @('official', 'testpvp') } else { @($ch) }
          foreach ($c in $channels) {
            $tag = "$c-v$ver"
            $asset = if ($c -eq 'testpvp') { 'dist/AandmAuto-TestPvP.exe' } else { 'dist/AandmAuto-Official.exe' }
            $title = if ($c -eq 'testpvp') { "测试服 PvP 专项版 v$ver" } else { "正式服优化版 v$ver" }
            $prevPref = $ErrorActionPreference
            $ErrorActionPreference = 'Continue'
            gh release view $tag *> $null
            $exists = ($LASTEXITCODE -eq 0)
            $ErrorActionPreference = $prevPref
            if ($exists) {
              gh release upload $tag $asset updates.json --clobber
            } else {
              gh release create $tag $asset updates.json --title $title --notes-file $notesFile
            }
          }

      - name: Commit updated updates.json to main
        shell: pwsh
        run: |
          Copy-Item -LiteralPath "updates.json" -Destination "$env:RUNNER_TEMP\updates.json" -Force
          git reset --hard
          git clean -fd
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git checkout -B main origin/main
          python -c "
          import json
          from pathlib import Path
          dst = Path('updates.json')
          new_data = json.loads(Path(r'$env:RUNNER_TEMP\updates.json').read_text('utf-8'))
          cur = json.loads(dst.read_text('utf-8')) if dst.exists() else {'schemaVersion': 1, 'channels': {}}
          ch = '${{ steps.meta.outputs.channel }}'
          chs = ['official', 'testpvp'] if ch == 'all' else [ch]
          cur['schemaVersion'] = 1
          cur['updatedAt'] = new_data.get('updatedAt', '')
          if new_data.get('mirrors'):
              cur['mirrors'] = new_data['mirrors']
          cur.setdefault('channels', {})
          for c in chs:
              if c in new_data.get('channels', {}):
                  cur['channels'][c] = new_data['channels'][c]
          dst.write_text(json.dumps(cur, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          "
          git add updates.json
          git diff --cached --quiet
          if ($LASTEXITCODE -ne 0) {
            git commit -m "chore(release): update updates.json for ${{ steps.meta.outputs.channel }} v${{ steps.meta.outputs.version }} [skip ci]"
            git push origin main
          }
